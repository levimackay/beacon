name: Beacon
options:
  bundleIdPrefix: com.levimackay.beacon
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  Beacon:
    type: application
    platform: macOS
    sources:
      - path: Beacon
      - path: Shared
    info:
      path: Beacon/Info.plist
      properties:
        CFBundleName: Beacon
        CFBundleDisplayName: Beacon
        # A menu bar app has no Dock presence and no main menu of its own.
        LSUIElement: true
        NSHumanReadableCopyright: "Copyright 2026 Levi Mackay"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.levimackay.beacon
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright 2026 Levi Mackay"
        # No sandbox: the app reads the hub's token from its support
        # directory, which a sandboxed process cannot reach. The app talks
        # only to 127.0.0.1 and owns no network surface of its own.
        ENABLE_APP_SANDBOX: NO
    dependencies:
      - target: BeaconWidget
        embed: true
        codeSign: true

  BeaconWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: BeaconWidget
      - path: Shared
    info:
      path: BeaconWidget/Info.plist
      properties:
        CFBundleDisplayName: Beacon
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.levimackay.beacon.widget
        ENABLE_APP_SANDBOX: NO
